<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>心霊スポット放置記</title>
  <meta name="description" content="銀髪の探検家ゆらが心霊スポットを巡る、ドット絵の放置ゲーム。">
  <meta name="theme-color" content="#07060c">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <div id="app">
    <div class="sticky-top">
      <header class="topbar">
        <h1>心霊スポット<span>放置記</span></h1>
        <div class="wallet">
          <img id="filmIcon" class="icon-m" alt="">
          <span id="film">0</span><small>フィルム</small>
        </div>
        <div class="rates">探索 <b id="rate">0</b>/秒　撮影 <b id="clickVal">1</b>/回</div>
      </header>

      <section class="scene-wrap" id="sceneWrap" aria-label="ゲーム画面（タップで撮影）">
        <canvas id="scene" width="576" height="324"></canvas>
        <div class="hud">
          <div class="stage-plate" id="stageName"></div>
          <div class="explore">
            <span>探索中</span>
            <div class="bar"><div id="exploreFill"></div></div>
          </div>
        </div>
        <div class="scene-log" id="sceneLog"></div>
        <div class="tap-hint" id="tapHint">TAPで撮影</div>
        <div id="floats"></div>
        <div class="step-event hidden" id="stepEvent" role="dialog" aria-label="足音イベント">
          <p class="step-text">……足音が聞こえる</p>
          <div class="step-btns">
            <button type="button" class="btn" id="stepRun">逃げる</button>
            <button type="button" class="btn affordable" id="stepShoot">撮る</button>
          </div>
          <div class="step-bar"><div id="stepTimer"></div></div>
        </div>
      </section>
    </div>

    <section class="panel">
      <nav class="tabs">
        <button type="button" data-tab="upgrades" class="active">装備</button>
        <button type="button" data-tab="spots" id="tabBtnSpots">スポット</button>
        <button type="button" data-tab="records" id="tabBtnRecords">記録</button>
      </nav>

      <div class="tab-body" id="tab-upgrades"></div>
      <div class="tab-body hidden" id="tab-spots"></div>
      <div class="tab-body hidden" id="tab-records">
        <div class="card records">
          <dl>
            <dt>総獲得フィルム</dt><dd id="stTotal">0</dd>
            <dt>撮影回数</dt><dd id="stClicks">0</dd>
            <dt>心霊写真</dt><dd id="stGhosts">0</dd>
            <dt>探索回数</dt><dd id="stExplores">0</dd>
            <dt>放置の上限</dt><dd id="stCap">8時間</dd>
            <dt>探索開始日</dt><dd id="stStart">-</dd>
          </dl>
        </div>
        <div class="card">
          <h3>心霊写真コレクション <span class="photo-count" id="photoCount">0 / 0</span></h3>
          <div class="photo-grid" id="photoGrid"></div>
        </div>
        <div class="card">
          <h3>実績 <span class="photo-count" id="achCount">0 / 0</span></h3>
          <ul class="ach-list" id="achList"></ul>
        </div>
        <div class="card">
          <h3>探索ノート</h3>
          <ul class="log-list" id="logList"></ul>
        </div>
        <div class="card settings">
          <button type="button" class="btn" id="soundBtn">効果音：ON</button>
          <button type="button" class="btn danger" id="resetBtn">データを削除</button>
          <p class="note">セーブはこのブラウザ（localStorage）に自動で保存されます。</p>
        </div>
        <div class="card savecode">
          <h3>セーブコード（引っ越し・バックアップ）</h3>
          <p class="note">「書き出す」で表示される文字列をメモ帳などに保管しておくと、別のブラウザやスマホに貼り付けて続きから遊べます。</p>
          <textarea id="codeBox" rows="4" spellcheck="false" autocomplete="off" placeholder="ここにセーブコードが表示されます／読み込むコードを貼り付けてください"></textarea>
          <div class="code-btns">
            <button type="button" class="btn" id="exportBtn">書き出す（コピー）</button>
            <button type="button" class="btn" id="importBtn">読み込む</button>
          </div>
          <p class="code-msg" id="codeMsg"></p>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p id="disclaimer"></p>
    </footer>
  </div>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button type="button" class="btn affordable" id="modalOk">OK</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="ach-toast" id="achToast" aria-live="polite">
    <span class="ach-badge">🏆 実績解除</span>
    <div class="ach-name"></div>
    <div class="ach-desc"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/backdrop.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
